[build-system]
requires = ["setuptools>=77"]  # 77 reads the license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "pqax"
version = "0.1.2"
description = "Read, validate, and write PQAX files: the footprint of Parquet tables, for analysis without access to the data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "SQLBI" }]
keywords = ["pqax", "parquet", "delta", "lakehouse", "footprint", "vertipaq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars>=1.0"]
dev = ["pytest", "jsonschema>=4.18"]

[project.scripts]
pqax = "pqax.__main__:main"

[tool.setuptools]
packages = ["pqax"]

[tool.setuptools.package-data]
pqax = ["py.typed"]

[project.urls]
Homepage = "https://pqax.org"
Repository = "https://github.com/pqax-org/pqax"
