<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190.72 38.4">
  <title>PQAX logo, Chunks Blue with Red Hat Display Bold, for light mode</title>
  <!-- C is the cap height of the wordmark. The mark is a square of side 1.2 C, centered on the cap height, and 0.5 C from the P, measured on the ink: the 56 unit square of the mark and the outlines of the letters. Here C = 32. The mark is the same in both modes; the wordmark is #1E293B. Generated by build.py from marks/chunks-blue.svg and wordmarks/red-hat-display-bold.svg -->
  <g transform="translate(-2.743 -2.743) scale(0.68571)">
    <!-- A Parquet file: three row groups of column chunks, on a 4 unit grid -->
    <!-- One file for light and dark mode, as a transparent bitmap needs: #3C7AFE is 3.9:1 on white and
         5.4:1 on black, #EA580C 3.6:1 and 5.9:1. Only the wordmark beside it changes with the mode -->
    <g fill="#3C7AFE">
      <!-- Row group 1; the folded corner of the file cuts its last chunk -->
      <rect x="4" y="4" width="24" height="12"/>
      <rect x="32" y="4" width="8" height="12"/>
      <path d="M44 4H48L60 16H44Z"/>
      <!-- Row group 2 -->
      <rect x="4" y="20" width="20" height="12"/>
      <rect x="28" y="20" width="12" height="12"/>
      <rect x="44" y="20" width="16" height="12"/>
      <!-- Row group 3 -->
      <rect x="4" y="36" width="28" height="12"/>
      <rect x="36" y="36" width="8" height="12"/>
      <rect x="48" y="36" width="12" height="12"/>
    </g>
    <!-- Footer: the metadata that PQAX is built from; the chunks themselves are not read -->
    <rect fill="#EA580C" x="4" y="52" width="56" height="8"/>
  </g>
  <g fill="#1E293B" transform="translate(54.4 2.698) scale(0.32)">
    <path d="M0 101.57V1.57H50.14Q60 1.57 67.57 5.57Q75.14 9.57 79.43 16.71Q83.71 23.86 83.71 33Q83.71 42 79.36 49Q75 56 67.43 60Q59.86 64 50.14 64H20.71V101.57ZM20.71 46.71H47.86Q54.57 46.71 58.64 43Q62.71 39.29 62.71 33.14Q62.71 26.86 58.64 23.14Q54.57 19.43 47.86 19.43H20.71Z"/>
