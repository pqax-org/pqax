name: Pages

# Deploys site/, the one-page site of pqax.org, to GitHub Pages on every push to main that changes it. The storage
# views live at pqax.tools, in the repository pqax-org/pqax.tools; site/tools/ only redirects there. The custom
# domain and HTTPS are set in the repository settings, Pages, with the source "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
