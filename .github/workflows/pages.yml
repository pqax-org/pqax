name: Pages

# Deploys pqax.org to GitHub Pages on every push to main that changes the site, the two TypeScript packages that the
# storage views at /tools/ load, or this workflow. The published folder is site/ plus the built packages under
# tools/lib/, which src/typescript/views/scripts/site.mjs assembles; built files are not committed. The custom domain
# and HTTPS are set in the repository settings, Pages, with the source "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/typescript/pqax/**
      - src/typescript/views/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # npm ci at the root installs the two workspaces and links the views to the reader.
      - name: Build the reader and the views
        run: |
          npm ci
          npm run build
      - name: Assemble the site
        run: node src/typescript/views/scripts/site.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
